<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sline Vision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <h1 class="logo">SLINE</h1>

  <input 
    type="text" 
    id="search" 
    placeholder="Search products..."
    onkeyup="searchProducts()"
  >

  <div class="icons">
    ❤️ 🛒 <span id="cart-count">0</span>
  </div>
</header>

<!-- CATEGORY MENU -->
<nav class="nav">
  <span>Women</span>
  <span>Men</span>
  <span>New</span>
  <span>Sale</span>
</nav>

<!-- PRODUCTS -->
<section class="products">

  <div class="product">
    <div class="img-box">
      <img src="https://via.placeholder.com/300">
    </div>
    <h3>Oversized T-Shirt</h3>
    <p class="price">R199</p>
    <button onclick="addToCart()">Add to Cart</button>
  </div>

  <div class="product">
    <div class="img-box">
      <img src="https://via.placeholder.com/300">
    </div>
    <h3>Street Hoodie</h3>
    <p class="price">R349</p>
    <button onclick="addToCart()">Add to Cart</button>
  </div>

</section>

<script src="script.js"></script>
</body>
</html>
