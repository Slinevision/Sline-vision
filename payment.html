<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

.payment-box {
  max-width: 400px;
  margin: auto;
}

button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  background: black;
  color: white;
}

button:hover {
  background: red;
}

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}
</style>
</head>

<body>

<h2>Select Payment Method</h2>

<div class="payment-box">

  <button onclick="showCard()">💳 Pay with Card</button>
  <button onclick="payCash()">🚚 Cash on Delivery</button>

  <div id="card-form" style="display:none;">
    <h3>Enter Card Details</h3>
    <input type="text" placeholder="Card Number">
    <input type="text" placeholder="Expiry Date">
    <input type="text" placeholder="CVV">

    <button onclick="payNow()">Pay Now</button>
  </div>

</div>

<script>
function showCard() {
  document.getElementById("card-form").style.display = "block";
}

function payCash() {
  alert("Order placed! Pay on delivery 🚚");
  window.location.href = "index.html";
}

function payNow() {
  alert("Payment successful ✅");
  window.location.href = "index.html";
}
</script>

</body>
</html>
