<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slinevision Checkout</title>

<style>
body {
  background: #ffffff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
  color: #111;
}

h1 {
  font-size: 26px;
  margin-bottom: 20px;
}

h2 {
  font-size: 21px;
  margin-top: 20px;
}

.search {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* CART */
.cart-box {
  margin-top: 20px;
  background: #f5f5f5;
  padding: 15px;
  border-radius: 12px;
}

.cart-item {
  background: white;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.product-name {
  font-weight: bold;
  font-size: 17px;
}

.product-price {
  margin-top: 5px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}

.quantity button {
  width: 40px;
  padding: 7px;
  margin: 0;
  background: black;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.remove {
  width: 100%;
  background: #d00000;
  color: white;
  border: none;
  padding: 9px;
  border-radius: 7px;
  margin-top: 10px;
  cursor: pointer;
}

.total {
  font-size: 20px;
  font-weight: bold;
  margin-top: 15px;
}

/* CUSTOMER DETAILS */
.checkout {
  margin-top: 20px;
  background: #f1f1f1;
  padding: 15px;
  border-radius: 12px;
}

input[type="text"] {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* PAYMENT */
.payment-option {
  display: block;
  background: white;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.payment-option input {
  width: auto;
  margin-right: 8px;
}

/* BUTTON */
.continue-btn {
  width: 100%;
  padding: 14px;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 17px;
  cursor: pointer;
}

.continue-btn:hover {
  background: #333;
}

.empty-cart {
  text-align: center;
  padding: 20px;
  color: #777;
}
</style>
</head>

<body>

<h1>SLINEVISION</h1>

<!-- SEARCH -->
<input
  class="search"
  placeholder="Search products..."
>

<!-- CART -->
<div class="cart-box">

  <h2>🛒 Your Cart</h2>

  <div id="cart-items"></div>

  <div id="cart-total" class="total"></div>

</div>


<!-- CHECKOUT -->
<div class="checkout">

  <h2>Customer Details</h2>

  <input
    type="text"
    placeholder="Full Name"
    id="name"
  >

  <input
    type="text"
    placeholder="Phone Number"
    id="phone"
  >

  <input
    type="text"
    placeholder="Address"
    id="address"
  >


  <!-- PAYMENT METHOD -->
  <h2>Payment Method</h2>

  <label class="payment-option">
    <input
      type="radio"
      name="payment"
      value="Visa / Mastercard"
      checked
    >
    💳 Visa / Mastercard
  </label>

  <label class="payment-option">
    <input
      type="radio"
      name="payment"
      value="PayPal"
    >
    🅿️ PayPal
  </label>

  <label class="payment-option">
    <input
      type="radio"
      name="payment"
      value="Cash on Delivery"
    >
    💵 Cash on Delivery
  </label>


  <!-- CONTINUE -->
  <button
    class="continue-btn"
    onclick="continueToPayment()"
  >
    Continue to Payment
  </button>

</div>


<script>

// GET CART FROM LOCAL STORAGE
let cart = JSON.parse(
  localStorage.getItem("cart")
) || [];


// DISPLAY CART
function displayCart() {

  const cartItems =
    document.getElementById("cart-items");

  const cartTotal =
    document.getElementById("cart-total");

  cartItems.innerHTML = "";

  if (cart.length === 0) {

    cartItems.innerHTML =
      '<div class="empty-cart">' +
      '🛒 Your cart is empty.' +
      '</div>';

    cartTotal.innerHTML = "";

    return;
  }


  let total = 0;


  cart.forEach(function(item, index) {

    // Make sure quantity exists
    if (!item.quantity) {
      item.quantity = 1;
    }


    let price =
      Number(item.price);

    let itemTotal =
      price * item.quantity;

    total += itemTotal;


    cartItems.innerHTML += `

      <div class="cart-item">

        <div class="product-name">
          ${item.name}
        </div>

        <div class="product-price">
          R${price.toFixed(2)}
        </div>

        <div class="quantity">

          <button
            onclick="decreaseQuantity(${index})"
          >
            −
          </button>

          <strong>
            ${item.quantity}
          </strong>

          <button
            onclick="increaseQuantity(${index})"
          >
            +
          </button>

        </div>

        <button
          class="remove"
          onclick="removeItem(${index})"
        >
          Remove
        </button>

      </div>

    `;

  });


  cartTotal.innerHTML =
    "Total: R" + total.toFixed(2);


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );
}


// INCREASE QUANTITY
function increaseQuantity(index) {

  cart[index].quantity =
    (cart[index].quantity || 1) + 1;

  saveCart();

}


// DECREASE QUANTITY
function decreaseQuantity(index) {

  if (cart[index].quantity > 1) {

    cart[index].quantity--;

  } else {

    cart.splice(index, 1);

  }

  saveCart();

}


// REMOVE ITEM
function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

}


// SAVE CART
function saveCart() {

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  displayCart();

}


// CONTINUE TO PAYMENT
function continueToPayment() {

  if (cart.length === 0) {

    alert(
      "Your cart is empty. Please add products first."
    );

    return;
  }


  let name =
    document.getElementById("name").value.trim();

  let phone =
    document.getElementById("phone").value.trim();

  let address =
    document.getElementById("address").value.trim();


  if (!name || !phone || !address) {

    alert(
      "Please enter your full name, phone number and address."
    );

    return;
  }


  // SELECTED PAYMENT METHOD
  let payment =
    document.querySelector(
      'input[name="payment"]:checked'
    ).value;


  // CREATE ORDER LIST
  let orderItems = "";

  let total = 0;


  cart.forEach(function(item) {

    let price =
      Number(item.price);

    let quantity =
      item.quantity || 1;

    let subtotal =
      price * quantity;

    total += subtotal;


    orderItems +=
      "• " +
      item.name +
      " x" +
      quantity +
      " = R" +
      subtotal.toFixed(2) +
      "\n";

  });


  // WHATSAPP MESSAGE
  let message =
    "🛒 NEW SLINEVISION ORDER\n\n" +

    "ORDER ITEMS:\n" +
    orderItems +

    "\nTOTAL: R" +
    total.toFixed(2) +

    "\n\nPAYMENT METHOD:\n" +
    payment +

    "\n\nCUSTOMER DETAILS:\n" +
    "Name: " +
    name +

    "\nPhone: " +
    phone +

    "\nAddress: " +
    address;


  // YOUR WHATSAPP NUMBER
  let whatsappNumber =
    "27691603308";


  // CREATE WHATSAPP LINK
  let whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);


  // OPEN WHATSAPP
  window.location.href =
    whatsappURL;

}


// SHOW CART WHEN PAGE LOADS
displayCart();

</script>

</body>
</html>
