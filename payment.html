<script>
function placeOrder(e) {
  e.preventDefault();

  let name = document.querySelector('input[placeholder="Full Name"]').value;
  let phone = document.querySelector('input[placeholder="Phone Number"]').value;
  let address = document.querySelector('input[placeholder="Address"]').value;

  let cart = localStorage.getItem("cart") || 0;
  let total = (cart * 199.99).toFixed(2);

  let message = `🛍️ *New Order*%0A
Items: ${cart}%0A
Total: R${total}%0A
Name: ${name}%0A
Phone: ${phone}%0A
Address: ${address}`;

  let whatsappNumber = "0691603308"; // 🔥 PUT YOUR NUMBER HERE

  let url = `https://wa.me/${whatsappNumber}?text=${message}`;

  window.open(url, "_blank");

  localStorage.removeItem("cart");
}
</script>
</body>
</html>
